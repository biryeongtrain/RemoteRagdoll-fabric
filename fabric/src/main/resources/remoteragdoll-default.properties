# RemoteRagdoll (Fabric). Copied to config/remoteragdoll.properties on first start.

# Leave a body when a player dies.
on-death=true
# How long a body stays, in seconds.
lifetime-seconds=120
# Hide the vanilla dying player from everybody else (it overlaps the body).
hide-dying-player=true
# How hard a swing kicks a body. 0 turns kicking off.
kick-strength=1.0

# Gap opened along the inner seams of the limbs, in skin pixels.
corpse.seam-pixels=0.0
# How far each slice is pulled inwards, as a fraction of the limb's width.
corpse.side-inset-percent=0.1
# Rotation of the item left in the hand, in degrees.
corpse.hand-yaw=-90
corpse.hand-pitch=0
corpse.hand-roll=0
